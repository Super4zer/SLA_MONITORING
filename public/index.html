<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLA Monitoring Command Center</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="dashboard-title">
            <h1>SLA Command Center</h1>
            <p>Live WhatsApp Support Monitoring (Target: 180s)</p>
        </div>
        <div class="clock" id="live-clock">00:00:00</div>
    </header>

    <main class="grid-container">
        <!-- Column 1: Waiting -->
        <section class="column">
            <div class="column-header waiting">
                <span><i class="icon-wait"></i> Menunggu Balasan (<= 3 Menit)</span>
                <span class="counter" id="count-waiting">0</span>
            </div>
            <div class="ticket-list" id="list-waiting">
                <div class="empty-state">Memuat data...</div>
            </div>
        </section>

        <!-- Column 2: Overdue -->
        <section class="column">
            <div class="column-header overdue">
                <span><i class="icon-alert"></i> Terlambat (> 3 Menit)</span>
                <span class="counter" id="count-overdue">0</span>
            </div>
            <div class="ticket-list" id="list-overdue">
                <div class="empty-state">Memuat data...</div>
            </div>
        </section>

        <!-- Column 3: Completed -->
        <section class="column">
            <div class="column-header completed">
                <span><i class="icon-check"></i> Selesai (Direspon)</span>
                <span class="counter" id="count-completed">0</span>
            </div>
            <div class="ticket-list" id="list-completed">
                <div class="empty-state">Memuat data...</div>
            </div>
        </section>
    </main>

    <!-- DOMPurify to prevent XSS from unescaped message contents -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.3/purify.min.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
